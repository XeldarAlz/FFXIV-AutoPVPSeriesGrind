name: Bug report
description: Something's broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]
assignees: ["XeldarAlz"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out as much as you can; it makes a huge difference.

        If you're not sure whether it's a bug or expected behavior, prefer [Help & troubleshooting discussions](https://github.com/XeldarAlz/FFXIV-AutoPVPSeriesGrind/discussions/new?category=help-troubleshooting); triage is faster there.

        For security issues, please use [private vulnerability reporting](https://github.com/XeldarAlz/FFXIV-AutoPVPSeriesGrind/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? What did you expect to see instead?
      placeholder: "The match started but the character never left spawn / never fired the Limit Break / lost the team in Frontline..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. If it's intermittent, say so.
      placeholder: |
        1. Open `/apsg`
        2. Set a match limit
        3. Press Start
        4. ...
    validations:
      required: true

  - type: dropdown
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown in `/xlplugins` next to "Auto PVP Series Grind".
      options:
        - 2.7.0.0
        - 2.6.0.0
        - 2.5.0.0
        - 2.4.0.0
        - 2.3.1.0
        - Older / not sure
    validations:
      required: true

  - type: input
    id: job-affected
    attributes:
      label: Job(s) affected
      description: Which job(s) were you on? The rotation and the Limit Break presets are per-job.
      placeholder: "WAR, PLD, ..."

  - type: input
    id: map-affected
    attributes:
      label: Map(s) affected
      description: Which Crystalline Conflict map(s) or Frontline arena(s) were involved, if the issue is map-specific?
      placeholder: "Palaistra, Cloud Nine, Seal Rock, ..."

  - type: dropdown
    id: stage
    attributes:
      label: Where in the run did it fail?
      description: The loop runs queue -> enter match -> portraits/hello -> play the objective -> Limit Break -> results -> leave -> requeue.
      options:
        - Queue (didn't queue / wrong content)
        - Match entry (didn't detect the match / portraits)
        - Movement (vnavmesh issue, stuck, didn't reach the objective or the team)
        - Combat (built-in rotation didn't press skills, Guard or Purify)
        - Frontline (mount / dismount, lost the team, respawn handling)
        - Limit Break (didn't fire / wrong action)
        - Results / leave (didn't leave the duty after the match)
        - Requeue (didn't queue the next match)
        - Selection / UI (issue before pressing Start)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: |
        **If you can provide any of these, it turns guesswork into a fix.**

        - **Plugin console**: open `/apsg log`, press *Copy log* and paste the result into the console field below. It already includes the plugin version, Dalamud version and zone.
        - **Dalamud log**: open `/xllog`, click the *Open log folder* button at the bottom-right, attach `dalamud.log`. Filter by `[APSG]` if you want to trim it down.
        - **Screenshots / short clip** if the issue is visual.
        - **Other plugins active** that touch PvP, combat, movement, or input — helps rule out conflicts.

  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: |
        Paste what *Copy log* on the plugin's Console page (`/apsg log`) put on your clipboard. Short snippets (chat-log tail, Dalamud error text) also belong here; attach full `dalamud.log` files under **Attachments** above.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Character class/job, current Series rank, hunches, anything that helps the bug land.
